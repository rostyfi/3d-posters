<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Bottom layer: large blue rectangle -->
  <rect x="10" y="10" width="100" height="100" fill="#0000ff"/>
  
  <!-- Top layer: smaller red rectangle that overlaps blue -->
  <rect x="50" y="50" width="80" height="80" fill="#ff0000"/>
  
  <!-- Another rectangle that doesn't overlap -->
  <rect x="120" y="120" width="60" height="60" fill="#00ff00"/>
  
  <!-- Two adjacent same-color circles -->
  <circle cx="30" cy="150" r="20" fill="#ffff00"/>
  <circle cx="60" cy="150" r="20" fill="#ffff00"/>
</svg>
