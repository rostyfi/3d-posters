<!DOCTYPE html>
<html>
<head><title>Debug Test</title></head>
<body>
<h1>Debug Test for Color Simplification</h1>
<div id="output"></div>

<script>
// Copy the relevant functions
function colorToRGB(color) {
    if (color.startsWith('#')) {
        const hex = color.substring(1);
        let r, g, b;
        if (hex.length === 3) {
            r = parseInt(hex[0] + hex[0], 16);
            g = parseInt(hex[1] + hex[1], 16);
            b = parseInt(hex[2] + hex[2], 16);
        } else if (hex.length === 4) {
            r = parseInt(hex[0] + hex[0], 16);
            g = parseInt(hex[1] + hex[1], 16);
            b = parseInt(hex[2] + hex[2], 16);
        } else if (hex.length === 6) {
            r = parseInt(hex.substring(0, 2), 16);
            g = parseInt(hex.substring(2, 4), 16);
            b = parseInt(hex.substring(4, 6), 16);
        } else if (hex.length === 7) {
            r = parseInt(hex.substring(0, 2), 16);
            g = parseInt(hex.substring(2, 4), 16);
            b = parseInt(hex.substring(4, 6), 16);
        } else if (hex.length >= 8) {
            r = parseInt(hex.substring(0, 2), 16);
            g = parseInt(hex.substring(2, 4), 16);
            b = parseInt(hex.substring(4, 6), 16);
        }
        return {r, g, b};
    }
    const namedColors = {'red':{r:255,g:0,b:0},'green':{r:0,g:128,b:0},'blue':{r:0,g:0,b:255},'black':{r:0,g:0,b:0},'white':{r:255,g:255,b:255}};
    const lowerColor = color.toLowerCase();
    if (namedColors[lowerColor]) return namedColors[lowerColor];
    return {r:0,g:0,b:0};
}

function rgbToHex(rgb) {
    const r = Math.max(0, Math.min(255, rgb.r));
    const g = Math.max(0, Math.min(255, rgb.g));
    const b = Math.max(0, Math.min(255, rgb.b));
    const toHex = c => {
        const hex = c.toString(16);
        return hex.length === 1 ? '0' + hex : hex;
    };
    return '#' + toHex(r) + toHex(g) + toHex(b);
}

function applyColorMap(svgContent, colorMap) {
    let result = svgContent;
    
    // Normalize hex colors
    result = result.replace(/#([0-9a-f]{8})/gi, (m, p1) => '#' + p1.substring(0,6).toLowerCase());
    result = result.replace(/#([0-9a-f]{7})/gi, (m, p1) => '#' + p1.substring(0,6).toLowerCase());
    result = result.replace(/#([0-9a-f]{6})/gi, (m, p1) => '#'+p1.toLowerCase());
    result = result.replace(/#([0-9a-f]{4})/gi, (m, p1) => {
        const r=p1[0].toLowerCase(),g=p1[1].toLowerCase(),b=p1[2].toLowerCase();
        return '#'+r+r+g+g+b+b;
    });
    result = result.replace(/#([0-9a-f]{3})/gi, (m, p1) => {
        const r=p1[0].toLowerCase(),g=p1[1].toLowerCase(),b=p1[2].toLowerCase();
        return '#'+r+r+g+g+b+b;
    });
    
    // Apply color map
    for (const [oldHex, newHex] of Object.entries(colorMap)) {
        if (oldHex.startsWith('#')) {
            const oldNorm = oldHex.toLowerCase();
            const newNorm = newHex.toLowerCase();
            result = result.replace(
                new RegExp(oldNorm + '(?![0-9a-fA-F])', 'gi'),
                newNorm
            );
        }
    }
    
    return result;
}

// Test with the Fallout SVG colors
const testSVG = `<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="300" height="400" fill="#e6bb43"/>
  <rect x="20" y="20" width="260" height="80" fill="#35537b"/>
  <text x="150" y="50" text-anchor="middle" fill="#f6f6f2" font-size="24" font-family="Arial, sans-serif">DON'T LOSE</text>
  <rect x="40" y="300" width="220" height="60" fill="#35537b"/>
  <rect x="20" y="320" width="260" height="60" fill="#090808"/>
</svg>`;

// Create a simple color map (identity for testing)
const colorMap = {
    '#e6bb43': '#ff0000',
    '#35537b': '#00ff00',
    '#f6f6f2': '#0000ff',
    '#090808': '#ffff00'
};

const result = applyColorMap(testSVG, colorMap);
document.getElementById('output').innerHTML = '<h3>Input:</h3><pre>' + escapeHtml(testSVG) + '</pre>' +
    '<h3>Output:</h3><pre>' + escapeHtml(result) + '</pre>' +
    '<h3>Rendered:</h3><div style="border:1px solid black;">' + result + '</div>';

function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>
