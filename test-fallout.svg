<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="300" height="400" fill="#e6bb43"/>
  <rect x="20" y="20" width="260" height="80" fill="#35537b"/>
  <text x="150" y="50" text-anchor="middle" fill="#f6f6f2" font-size="24" font-family="Arial, sans-serif">DON'T LOSE</text>
  <g transform="translate(150, 120)">
    <circle cx="0" cy="0" r="80" fill="#35537b"/>
    <circle cx="0" cy="0" r="60" fill="#f6f6f2"/>
    <!-- Simple vault boy face -->
    <circle cx="-20" cy="-10" r="8" fill="#090808"/>
    <circle cx="20" cy="-10" r="8" fill="#090808"/>
    <path d="M -15 10 Q 0 25 15 10" fill="none" stroke="#090808" stroke-width="3"/>
    <!-- Thumbs up hand -->
    <g transform="translate(-40, 20)">
      <rect x="-10" y="-5" width="20" height="10" fill="#f6f6f2" rx="5"/>
      <rect x="10" y="-10" width="8" height="20" fill="#f6f6f2" rx="4"/>
    </g>
    <!-- Other hand -->
    <g transform="translate(40, 20)">
      <rect x="-10" y="-5" width="20" height="10" fill="#f6f6f2" rx="5"/>
      <rect x="-18" y="-10" width="8" height="20" fill="#f6f6f2" rx="4"/>
    </g>
  </g>
  <rect x="40" y="300" width="220" height="60" fill="#35537b"/>
  <rect x="20" y="320" width="260" height="60" fill="#090808"/>
</svg>